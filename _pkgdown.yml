url: https://sedzinfo.github.io/golemeurostat/

template:
  bootstrap: 5
  bootswatch: flatly
  math-rendering: katex   # renders the \eqn and \deqn maths of the help pages
  includes:
    # cookie banner and Google Analytics, shared by every site under sedzinfo.github.io (consent.js in that repository)
    after_body: '<script src="/consent.js" defer></script>'
  # the preview card that LinkedIn, Bluesky, Mastodon, Slack and others show when a page is shared:
  # pkgdown/assets/card.png (1200x630), which pkgdown copies to the root of the site
  opengraph:
    image:
      src: card.png
      alt: "golemeurostat: Eurostat Indicators Explorer, with the Country Comparison tab showing the GDP per inhabitant in PPS of Greece and Bulgaria"

code:
  width: 200

destination: docs

navbar:
  structure:
    left: [intro, reference, articles]
    right: [app, sedzinfo, github]
  components:
    app:
      icon: fas fa-play
      text: live app
      href: https://sedzinfo.shinyapps.io/golemeurostat/
      aria-label: Open the live app
    sedzinfo:
      icon: fas fa-house
      text: home
      href: https://sedzinfo.github.io/
      aria-label: sedzinfo home page
    github:
      icon: fab fa-github
      href: https://github.com/sedzinfo/golemeurostat
      aria-label: GitHub

reference:

  - title: "App"
    contents:
      - run_app

  - title: "Data"
    desc: "The catalogue of indicators and countries, downloading an indicator from Eurostat for the countries or the regions, or the population of a country by age and sex, checking the catalogue against Eurostat, and the values of all the indicators that the Change (%) tab compares; the values of an indicator of the countries or the regions, or the population of a country by age and sex, as saved in the package, without internet, which the examples of the charts use"
    contents:
      - all_values
      - check_indicators
      - countries
      - get_indicator
      - get_pyramid
      - get_regional
      - indicator_change
      - indicators
      - saved_indicator
      - saved_pyramid
      - saved_regional

  - title: "Plot"
    desc: "The plotly charts of the tabs: country and indicator comparisons, population pyramid, ranked bars, maps of the countries and of the regions, scatter plot"
    contents:
      - plot_bar
      - plot_country_comp
      - plot_indicator_comp
      - plot_map
      - plot_pyramid
      - plot_regions
      - plot_scatter

  - title: "Render"
    desc: "The tables of the Change (%) and Indicators tabs"
    contents:
      - render_change_table
      - render_index_table

  # the modules are @keywords internal, and matches() skips internal topics unless internal = TRUE;
  # it lists the topics it matches alphabetically
  - title: "UI"
    desc: "Internal functions not meant to run independently"
    contents:
      - matches("^mod_.*_ui$", internal = TRUE)

  - title: "Server"
    desc: "Internal functions not meant to run independently"
    contents:
      - matches("^mod_.*_server$", internal = TRUE)

footer:
  structure:
    left: sedzinfo
    right: sedzinfo_home
  components:
    sedzinfo: '[github.com/sedzinfo](https://github.com/sedzinfo) · [Cookie settings](#cookie-settings)'
    sedzinfo_home: '[home](https://sedzinfo.github.io/)'
